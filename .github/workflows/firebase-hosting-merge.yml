# Auto-deploy to Firebase Hosting on push to main & sync /soil_all.json at 00:00 (GMT+7) daily
name: Deploy to Firebase Hosting & Nightly Soil Sync
on:
  push:
    branches:
      - main
  schedule:
    # 17:00 UTC = 00:00 (0h đêm) giờ Việt Nam (GMT+7) mỗi ngày
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync /soil_all.json from Firebase Realtime Database
        run: |
          node -e '
            const fs = require("fs");
            const url = "https://iot-farm-chilli-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";
            fetch(url)
              .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
              })
              .then(fbData => {
                if (!fbData || typeof fbData !== "object") throw new Error("Empty Firebase data");
                const payload = fbData.data ? fbData : { data: fbData };
                const jsonStr = JSON.stringify(payload);
                fs.writeFileSync("frontend/public/soil_all.json", jsonStr, "utf8");
                if (fs.existsSync("visualization")) {
                  fs.writeFileSync("visualization/soil_all.json", jsonStr, "utf8");
                }
                const days = Object.keys(payload.data).sort();
                console.log("Synced soil_all.json from Firebase:", days.length, "days, latest:", days[days.length - 1]);
              })
              .catch(err => {
                console.warn("Warning: Could not sync from Firebase, keeping existing soil_all.json:", err.message);
              });
          '

      - name: Commit updated soil_all.json on nightly schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/soil_all.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-sync soil_all.json from Firebase at 00:00 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install and Build Frontend
        run: npm run install:frontend && npm run build:frontend

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOT_FARM_CHILLI }}
          channelId: live
          projectId: iot-farm-chilli
