# =====================================================================
#  Cấu hình IoT Farm edge agent (Jetson Nano)
#  Sao chép thành config.ini rồi sửa:   cp config.example.ini config.ini
#  Chú thích phải nằm trên DÒNG RIÊNG (bắt đầu bằng #), không ghi sau giá trị.
#  Mọi khoá đều có giá trị mặc định – có thể xoá những dòng không cần.
# =====================================================================

[device]
# Định danh thiết bị -> đường dẫn devices/{device_id}/... trên Firebase
device_id = jetson-nano-01

[firebase]
# URL Realtime Database (Project settings -> Realtime Database), KHÔNG có dấu / ở cuối
db_url = https://iot-farm-chilli-default-rtdb.asia-southeast1.firebasedatabase.app
# Xác thực tài khoản thiết bị (để trống cả 3 => gửi request không xác thực, chỉ dùng khi rules đang mở)
# api_key = Web API Key (Project settings -> General -> Web API Key)
api_key =
email = jetson-nano-01@smartfarm.com
password =
# Timeout mỗi request HTTP (giây)
timeout_sec = 15

[sampling]
# Chu kỳ lấy mẫu mặc định (5..86400 s). Giá trị streaming/config/sampling_interval_sec
# trên Firebase (UI Settings) sẽ GHI ĐÈ giá trị này khi có mạng (nếu use_remote_interval = true)
sampling_interval_sec = 300
# Căn lịch đo theo mốc đồng hồ (giờ VN) khi đã đồng bộ NTP: 300 s -> hh:00, hh:05, ...
align_to_wall_clock = true
use_remote_interval = true

[soil]
# Cảm biến đất CWT 7in1 RS485 (USB-RS485)
enabled = true
port = /dev/ttyUSB0
slave_id = 2
baudrate = 9600
timeout_sec = 0.5
# Số lần thử lại khi Modbus lỗi
retries = 1

[dht20]
# DHT20 trên I2C bus 0 (chân 27 SDA, 28 SCL của Jetson Nano)
enabled = true
i2c_bus = 0
address = 0x38
retries = 1

[timesync]
# Máy chủ SNTP dùng để kiểm tra độ lệch giờ (cách nhau bằng dấu phẩy)
ntp_servers = pool.ntp.org, time.google.com
# Lệch < max_offset_sec giây => coi là đã đồng bộ
max_offset_sec = 2.0
sntp_timeout_sec = 2.0
use_timedatectl = true
use_sntp = true
# Chu kỳ kiểm tra khi chưa / đã đồng bộ (giây)
check_unsynced_sec = 15
check_synced_sec = 600
# true = tin đồng hồ hệ thống khi không có bằng chứng NTP (KHÔNG khuyến nghị trên Jetson không RTC)
trust_system_clock = false
# Bản ghi 'estimated' có ts nhỏ hơn mốc này (2024-01-01) bị cách ly, không upload
min_valid_epoch = 1704067200

[network]
# Timeout kiểm tra DNS + TCP tới Firebase (giây)
check_timeout_sec = 3
# Tạo file này trong data_dir để ép offline khi đang chạy (demo), xoá đi để online lại
force_offline_file = FORCE_OFFLINE

[upload]
# Số bản ghi tối đa mỗi lô PATCH (<= 500)
batch_size = 500
# Giới hạn hàng đợi SQLite; vượt quá sẽ xoá bản ghi CŨ NHẤT (có cảnh báo trong log)
queue_max_rows = 500000
backoff_initial_sec = 5
backoff_max_sec = 300
idle_poll_sec = 2
# Số log "upload thất bại" tối đa lưu cục bộ để đẩy lên Firebase khi có mạng lại
failed_log_max = 1000

[heartbeat]
# heartbeat_sec = min(sampling_interval_sec, max_heartbeat_sec)
max_heartbeat_sec = 15
# Chu kỳ đọc streaming/config + streaming/control + lệnh đọc ngay (giây)
control_poll_sec = 2
# Đẩy giá trị trực tiếp lên devices/{device_id}/live (tách biệt với chu kỳ lưu /data)
live_enabled = true
live_interval_sec = 15

[relay]
# true = điều khiển GPIO thật (Waveshare 3CH Relay trên Jetson Nano); false = chỉ giả lập
relay_enabled = true
# Hệ đánh số chân GPIO: BOARD (số chân vật lý 1..40) hoặc BCM
# Sơ đồ mặc định mạch Waveshare 3CH Relay (jumper mặc định P29 / P28 / P25):
#   Relay 1 (CH1, P29) - Đèn chiếu sáng : BOARD = 40 (BCM = 21)
#   Relay 2 (CH2, P28) - Máy bơm nước   : BOARD = 38 (BCM = 20)
#   Relay 3 (CH3, P25) - Kênh dự phòng  : BOARD = 37 (BCM = 26, đặt 0 nếu không khởi tạo)
pin_mode = BOARD
light_pin = 40
pump_pin = 38
spare_pin = 37
# Mạch Waveshare 3CH Relay dùng opto kích mức thấp (LOW = đóng tiếp điểm BẬT, HIGH = ngắt TẮT)
active_low = true
# Bơm chạy liên tục quá số phút này sẽ bị tắt an toàn
max_pump_run_min = 30
# Đèn chạy liên tục quá số phút này sẽ bị tắt an toàn (0 = không giới hạn)
max_light_run_min = 960
# Thời lượng tưới theo lịch (phút) nếu Firebase chưa cấu hình irrigation_duration_min
default_irrigation_duration_min = 5
# Thời lượng bật đèn mỗi cữ (phút) khi dùng lịch đèn theo cữ tương tự máy bơm
default_light_duration_min = 120
# Ngưỡng nhiệt độ không khí tối đa (°C) ở chế độ đèn tự động (vượt ngưỡng sẽ ngắt đèn bảo vệ cây)
light_max_temp_c = 35.0
# Gửi lại báo cáo relay định kỳ (giây) dù không đổi trạng thái
report_every_sec = 60

[paths]
# Đường dẫn tương đối tính từ thư mục edge/
data_dir = data
log_dir = logs

[simulate]
# Chỉ dùng khi chạy --simulate: xác suất giả lập lỗi đọc cảm biến (0..1)
fail_prob = 0.0
moisture_start = 55
seed =

[logging]
level = INFO
